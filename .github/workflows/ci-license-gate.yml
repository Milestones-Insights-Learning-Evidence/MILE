name: CI & Open-Core License Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Build, Vet, Static Analysis & Race Tests (Community + EE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # go-version (not go-version-file) so the latest patched 1.26.x is installed.
      # go.mod declares `go 1.26.0` as a floor; resolving the file verbatim would pin
      # 1.26.0 and miss standard-library security fixes that govulncheck reports.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Check Go formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet (Community & Enterprise)
        run: |
          go vet ./...
          go vet -tags ee ./...

      - name: Run staticcheck (Community, default build tags)
        uses: dominikh/staticcheck-action@v1.3.0
        with:
          version: "latest"
          install-go: false

      # Files behind //go:build ee are invisible to the default run above, so the
      # Enterprise build tag is analysed in a second pass.
      - name: Run staticcheck (Enterprise, -tags ee)
        uses: dominikh/staticcheck-action@v1.3.0
        with:
          version: "latest"
          install-go: false
          build-tags: ee

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Verify Community build never imports proprietary ee/ packages
        run: |
          ee_imports="$(go list -deps ./cmd/moaj | grep '^github.com/MOAJ-Mentor-of-all-Jacks/MOAJ/ee' || true)"
          if [ -n "$ee_imports" ]; then
            echo "::error::Community build imports proprietary ee/ packages:"
            echo "$ee_imports"
            exit 1
          fi
          echo "OK: Community dependency graph is isolated from ee/."

      - name: Run unit tests with race detector (Community)
        run: go test -v -race ./...

      - name: Run unit tests with race detector (Enterprise -tags ee)
        run: go test -v -race -tags ee ./...

      - name: Compile Community & Enterprise single binaries
        run: |
          mkdir -p bin
          go build -trimpath -o bin/moaj ./cmd/moaj
          go build -trimpath -tags ee -o bin/moaj-ee ./cmd/moaj
          ./bin/moaj version
          ./bin/moaj-ee version

  license-gate:
    name: Dependency License Cleanliness (NFR-03)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Verify Go module allowlist (docs/governance/DEPENDENCY_LICENSES.md)
        run: make license-check

      - name: Run go-licenses check against copyleft/restricted licenses (IMS-GOV-01 §6)
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./cmd/moaj --disallowed_types=forbidden,restricted,reciprocal,unknown

      - name: Check UI dependencies license cleanliness (when ui/node_modules exists)
        run: |
          if [ -d "ui/node_modules" ]; then
            npx --yes license-checker \
              --start ui \
              --production \
              --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;Unlicense;CC-BY-4.0" \
              --excludePrivatePackages
          else
            echo "UI dependencies not installed yet (Phase 4 scaffold); skipping npm license-checker."
          fi

  # This job checks for a self-asserted acknowledgement sentence in the pull-request
  # body. That is a prompt, not proof: anyone can type it, GitHub does not
  # authenticate it, and no signature record is stored anywhere. It must not be
  # described or relied on as CLA verification. Actual CLA enforcement requires the
  # hosted CLA bot / signature database tracked under D17
  # (docs/governance/LICENSING_BOUNDARIES.md §5), which must be configured before any
  # external pull request is merged.
  cla-acknowledgement-prompt:
    name: CLA Acknowledgement Prompt (advisory - not signature verification; see D17)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check for self-asserted CLA acknowledgement text in the PR body
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$PR_AUTHOR" = "$REPO_OWNER" ] || [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "PR author ($PR_AUTHOR) is the repository owner or the dependency bot; no acknowledgement needed."
            exit 0
          fi
          if echo "$PR_BODY" | grep -Eq "I have read the CLA Document and I hereby sign the CLA"; then
            echo "Acknowledgement sentence present. NOTE: this is self-asserted and unverified."
            echo "A reviewer must confirm a real ICLA/CCLA signature (D17) before merging."
            exit 0
          fi
          echo "::error::Add the CLA acknowledgement sentence from CONTRIBUTING.md to the PR body."
          echo "::notice::This check only looks for that sentence. It does not verify a signature; a maintainer must confirm the executed ICLA/CCLA out of band until the hosted CLA bot (D17) is live."
          exit 1
