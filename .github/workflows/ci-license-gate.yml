name: CI & Open-Core License Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Build, Vet, Static Analysis & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # go-version (not go-version-file) so the latest patched 1.26.x is installed.
      # go.mod declares `go 1.26.0` as a floor; resolving the file verbatim would pin
      # 1.26.0 and miss standard-library security fixes that govulncheck reports.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Check Go formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet (Community & Enterprise)
        run: |
          go vet ./...
          go vet -tags ee ./...

      - name: Run staticcheck (Community, default build tags)
        uses: dominikh/staticcheck-action@v1.3.0
        with:
          version: "latest"
          install-go: false

      # Files behind //go:build ee are invisible to the default run above, so the
      # Enterprise build tag is analysed in a second pass.
      - name: Run staticcheck (Enterprise, -tags ee)
        uses: dominikh/staticcheck-action@v1.3.0
        with:
          version: "latest"
          install-go: false
          build-tags: ee

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Verify Community build never imports proprietary ee/ packages
        run: |
          ee_imports="$(go list -deps ./cmd/mile | grep '^github.com/Milestones-Insights-Learning-Evidence/MILE/ee' || true)"
          if [ -n "$ee_imports" ]; then
            echo "::error::Community build imports proprietary ee/ packages:"
            echo "$ee_imports"
            exit 1
          fi
          echo "OK: Community dependency graph is isolated from ee/."

      - name: Run unit tests with race detector (Community)
        run: go test -v -race ./...

      - name: Run unit tests with race detector (Enterprise -tags ee)
        run: go test -v -race -tags ee ./...

      - name: Compile Community & Enterprise single binaries
        run: |
          mkdir -p bin
          go build -trimpath -o bin/mile ./cmd/mile
          go build -trimpath -tags ee -o bin/mile-ee ./cmd/mile
          ./bin/mile version
          ./bin/mile-ee version

  # Every distributed dependency must use an approved permissive licence (NFR-03).
  license-gate:
    name: Dependency License Cleanliness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Verify Go module allowlist (docs/governance/DEPENDENCY_LICENSES.md)
        run: make license-check

      - name: Run go-licenses check against copyleft/restricted licenses (IMS-GOV-01 §6)
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./cmd/mile --disallowed_types=forbidden,restricted,reciprocal,unknown

      - name: Check UI dependencies license cleanliness (when ui/node_modules exists)
        run: |
          if [ -d "ui/node_modules" ]; then
            npx --yes license-checker \
              --start ui \
              --production \
              --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;Unlicense;CC-BY-4.0" \
              --excludePrivatePackages
          else
            echo "UI dependencies not installed yet (Phase 4 scaffold); skipping npm license-checker."
          fi

  # Every commit in a pull request must carry a Developer Certificate of Origin
  # sign-off from its own author (CONTRIBUTING.md §2). A sign-off is a statement
  # in the commit message, not a cryptographic signature.
  dco:
    name: DCO sign-off on every commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check each commit for its author's Signed-off-by line
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email="$(git log -1 --format='%ae' "$commit")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qiF "<$email>"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$commit") has no Signed-off-by line from its author <$email>."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed off by its author."
